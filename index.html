<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Justin’s ArtVerse</title>
<meta name="description" content="Illustrations by Justin, drawn in Procreate.">
<meta name="theme-color" content="#05040D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05040D; --bg2:#0E0C1F; --ink:#EEF0FF; --mute:#9C9BC0; --line:rgba(200,200,255,.13);
  --card:rgba(22,20,48,.78); --accent:#A78BFA; --on-accent:#15122B;
  --display:"Unbounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --iri:linear-gradient(100deg,#C7D2FE 0%,#F0ABFC 25%,#67E8F9 50%,#FDE68A 70%,#C7D2FE 100%);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The ArtVerse is a night-sky site in both viewer themes. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05040D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05040D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
::selection{background:var(--accent);color:var(--on-accent)}
button{font:inherit;color:inherit;cursor:pointer}
img,video{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400}
.muted{color:var(--mute)}

/* space backdrop */
.stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.nebula{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(70px);opacity:.75}
.nebula i{position:absolute;border-radius:50%;animation:drift 46s ease-in-out infinite alternate}
.nebula i:nth-child(1){width:55vw;height:45vw;left:5%;top:8%;background:radial-gradient(closest-side,rgba(124,58,237,.42),transparent)}
.nebula i:nth-child(2){width:50vw;height:40vw;right:0;top:30%;background:radial-gradient(closest-side,rgba(236,72,153,.26),transparent);animation-duration:58s;animation-direction:alternate-reverse}
.nebula i:nth-child(3){width:45vw;height:40vw;left:30%;bottom:0;background:radial-gradient(closest-side,rgba(34,211,238,.18),transparent);animation-duration:64s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,-4vw) scale(1.15)}}
.glow-cursor{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 14%,transparent),transparent);mix-blend-mode:screen;transition:opacity .4s;opacity:0}
@media (pointer:fine){.glow-cursor.on{opacity:1}}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,4vw,56px) 16px;transition:background .3s}
.nav.scrolled{background:rgba(5,4,13,.62);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.02em;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px 2px var(--accent)}
.nav-links{display:flex;gap:28px}
.nav-links button{background:none;border:0;padding:4px 0;color:var(--mute);transition:color .2s}
.nav-links button:hover{color:var(--ink)}
.nav-r{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;background:rgba(255,255,255,.04)}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:620px){.nav-links{display:none}}

/* hero */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden}
.orbit{position:absolute;left:50%;top:47%;width:0;height:0;z-index:2}
.ring{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none;opacity:0;animation:fadein 2s 1s forwards}
.ring.r2{border-style:dashed;border-color:rgba(200,200,255,.12)}
.core{position:absolute;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent) 6%,transparent) 55%,transparent);animation:pulse 7s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.8}}
.pc{position:absolute;left:0;top:0;border-radius:10px;overflow:hidden;cursor:zoom-in;opacity:0;will-change:transform,opacity;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 40px -8px rgba(0,0,0,.8),0 0 36px -6px color-mix(in srgb,var(--accent) 70%,transparent);background:var(--bg2)}
.pc img,.pc video{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:4;margin:0;text-align:center;pointer-events:none;width:max-content;max-width:94vw;
  font-family:var(--display);font-weight:700;font-size:clamp(46px,11.5vw,184px);line-height:.98;letter-spacing:-.01em;
  background:var(--iri);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(167,139,250,.35));
  opacity:0;animation:materialize 1.8s .75s cubic-bezier(.2,.8,.2,1) forwards,sheen 14s 2.5s linear infinite}
.hero h1.still{animation:sheen 14s linear infinite;opacity:1}
.hero h1 span{display:block}
@keyframes materialize{from{opacity:0;letter-spacing:.32em;filter:blur(20px) drop-shadow(0 0 30px rgba(167,139,250,.35))}to{opacity:1;letter-spacing:-.01em;filter:blur(0) drop-shadow(0 0 30px rgba(167,139,250,.35))}}
@keyframes sheen{to{background-position:-260% 0}}
.hero-foot{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:0 clamp(20px,5vw,72px);flex-wrap:wrap;opacity:0;animation:fadein 1.2s 2.2s forwards}
.tag{margin:0;max-width:30ch;color:var(--mute);font-size:clamp(15px,1.4vw,18px);white-space:pre-line}
.enter{display:inline-flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);background:rgba(255,255,255,.04);border-radius:999px;padding:11px 22px;box-shadow:0 0 24px -8px var(--accent);transition:box-shadow .3s,background .3s}
.enter:hover{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:0 0 34px -4px var(--accent)}
@keyframes fadein{to{opacity:1}}

/* sections */
.sec{position:relative;z-index:1;padding:clamp(72px,11vw,150px) clamp(20px,5vw,72px) 0;scroll-margin-top:60px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,52px)}
.sec h2{font-family:var(--display);font-weight:300;font-size:clamp(40px,6.5vw,92px);line-height:1;letter-spacing:-.02em}
.sec-note{color:var(--mute);margin:8px 0 0}

/* galaxies (series as planets) */
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:clamp(36px,5vw,64px) 28px}
.pl{background:none;border:0;padding:0;text-align:center;display:block}
.planet{position:relative;width:min(190px,64%);aspect-ratio:1;margin:18px auto 30px;--g:#A78BFA}
.ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1;background:var(--bg2);
  box-shadow:0 0 50px -4px color-mix(in srgb,var(--g) 70%,transparent),0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .5s}
.ball img,.ball video{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.15);transition:transform 6s cubic-bezier(.2,.6,.2,1)}
.ball::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.38),transparent 34%),radial-gradient(circle at 72% 78%,rgba(3,2,12,.85),transparent 62%),radial-gradient(circle,transparent 58%,rgba(3,2,12,.55))}
.pring{position:absolute;left:-30%;right:-30%;top:41%;height:18%;border-radius:50%;border:2px solid color-mix(in srgb,var(--g) 70%,transparent);transform:rotate(-16deg);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pring.back{z-index:0;clip-path:inset(0 0 50% 0)}
.pring.front{z-index:2;clip-path:inset(50% 0 0 0);box-shadow:0 0 14px -2px var(--g)}
.moon-orb{position:absolute;inset:-18%;z-index:2;animation:spin 9s linear infinite;pointer-events:none}
.moon-orb::before{content:"";position:absolute;left:50%;top:0;width:11%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--g));box-shadow:0 0 12px var(--g)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover){
  .pl:hover .ball{box-shadow:0 0 80px 4px color-mix(in srgb,var(--g) 80%,transparent),0 0 0 1px rgba(255,255,255,.2)}
  .pl:hover .ball img,.pl:hover .ball video{transform:scale(1.4) rotate(14deg)}
  .pl:hover .pring{transform:rotate(-6deg) scaleX(1.06)}
}
.p-name{display:block;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.p-meta{display:block;color:var(--mute);font-size:14px;margin-top:6px;padding:0 8px}
.pl.active .p-name{color:var(--accent)}

/* works */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:7px 16px;font-size:14px;transition:all .2s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 22px -6px var(--accent)}
.chip small{opacity:.6;margin-left:6px}
.grid{column-width:270px;column-gap:18px}
.tile{break-inside:avoid;margin:0 0 18px;position:relative;cursor:zoom-in;border-radius:14px;overflow:hidden;background:var(--bg2);
  box-shadow:0 0 0 1px rgba(255,255,255,.07);opacity:0;transform:translateY(14px);filter:blur(6px);
  transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s ease,box-shadow .4s}
.tile.in{opacity:1;transform:none;filter:none}
.tile img,.tile video{display:block;width:100%;height:auto;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
  .tile:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 80%,transparent),0 0 46px -6px var(--accent)}
  .tile:hover img,.tile:hover video{transform:scale(1.05)}
  .tile:hover .cap{opacity:1;transform:none}
}
.cap{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 14px;border-radius:10px;display:flex;flex-direction:column;
  background:rgba(8,6,22,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
.cap b{font-weight:500}.cap span{font-size:13px;color:var(--mute)}
.empty-box{border:1px dashed var(--line);border-radius:16px;padding:56px 24px;text-align:center;color:var(--mute)}
.notice{border:1px dashed var(--accent);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:14px;background:color-mix(in srgb,var(--accent) 7%,transparent)}

/* about */
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,6vw,96px)}
.bio{font-size:clamp(20px,2.3vw,28px);line-height:1.6;margin:0;white-space:pre-line;max-width:34em}
.contact{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding-top:6px}
.contact a{font-family:var(--display);font-weight:300;font-size:19px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;transition:color .2s,border-color .2s}
.contact a:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}}
footer{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:clamp(80px,11vw,140px) clamp(20px,5vw,72px) 40px;color:var(--mute);font-size:14px}
footer button{background:none;border:0;padding:0;color:inherit}
footer button:hover{color:var(--ink)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(4,3,12,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.lb.open{display:flex;flex-direction:column;animation:fadein2 .3s ease}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
.lb-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) clamp(12px,7vw,110px) 12px}
.lb-frame{display:grid;place-items:center;max-width:100%;transition:opacity .35s ease}
.lb-frame img,.lb-frame video{display:block;max-width:100%;max-height:calc(100svh - 250px);width:auto;height:auto;border-radius:6px;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 90px -10px color-mix(in srgb,var(--accent) 60%,transparent);transition:transform .35s ease;cursor:zoom-in}
.lb-frame img.zoomed{transform:scale(2.1);cursor:zoom-out}
.lb-info{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:8px clamp(16px,7vw,110px) calc(22px + env(safe-area-inset-bottom,0px));min-height:120px}
.lb-info h3{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.6vw,34px);line-height:1.2}
.lb-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-top:6px}
.lb-desc{margin:8px 0 0;max-width:60ch;color:var(--mute);font-size:15px;white-space:pre-line}
.lb-count{color:var(--mute);font-size:14px;white-space:nowrap;font-family:var(--display);font-weight:300}
.lb-btn{position:absolute;z-index:3;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;padding:0;transition:all .2s}
.lb-btn:hover{border-color:var(--accent);box-shadow:0 0 20px -4px var(--accent)}
.lb-close{top:calc(14px + env(safe-area-inset-top,0px));right:clamp(14px,3vw,40px)}
.lb-prev{left:clamp(8px,2vw,28px);top:50%;transform:translateY(-50%)}
.lb-next{right:clamp(8px,2vw,28px);top:50%;transform:translateY(-50%)}
@media (max-width:700px){.lb-prev,.lb-next{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:none}.lb-stage{padding-left:12px;padding-right:12px}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<noscript>Please turn on JavaScript to explore the ArtVerse.</noscript>
<div id="root"></div>
<!-- scripts/build.py fills in this data block -->
<script id="app-data" type="application/json">{}</script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false) continue;
    el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  if(tag==='video') el.muted=true;
  return el;
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
const plural=(n,one,many)=>n+' '+(n===1?one:many);

/* ---------- data (injected by scripts/build.py) ---------- */
const GLOWS=['#A78BFA','#67E8F9','#F472B6','#FBBF24','#34D399','#818CF8'];
const DEF_SITE={name:'Justin’s ArtVerse',tagline:'Illustrations drawn in Procreate.\nEvery piece is a star.',bio:'',email:'',links:[],accent:'#A78BFA'};
let data={site:{},series:[],works:[],featured:[]};
try{
  const d=JSON.parse($('#app-data').textContent||'{}');
  if(d&&typeof d==='object')data=Object.assign(data,d);
}catch(e){}
const site=Object.assign({},DEF_SITE,data.site||{});
const SERIES=Array.isArray(data.series)?data.series:[];
const WORKS=Array.isArray(data.works)?data.works:[];

/* sample art, shown only until the art/ folder has images */
function art(seed,w,hh,pal){
  let s=seed;const r=()=>((s=(s*9301+49297)%233280)/233280);
  let g='';
  for(let i=0;i<6;i++)g+='<circle cx="'+(r()*w|0)+'" cy="'+(r()*hh|0)+'" r="'+(hh*(.14+r()*.3)|0)+'" fill="'+pal[(i%(pal.length-1))+1]+'" opacity="'+(.45+r()*.5).toFixed(2)+'"/>';
  let st='';
  for(let i=0;i<40;i++)st+='<circle cx="'+(r()*w|0)+'" cy="'+(r()*hh|0)+'" r="'+(r()*2.2+.4).toFixed(1)+'" fill="#fff" opacity="'+(.4+r()*.6).toFixed(2)+'"/>';
  const px=w*(.3+r()*.4),py=hh*(.35+r()*.3),pr=w*(.13+r()*.08);
  const planet='<circle cx="'+(px|0)+'" cy="'+(py|0)+'" r="'+(pr|0)+'" fill="'+pal[pal.length-1]+'"/><circle cx="'+((px+pr*.35)|0)+'" cy="'+((py+pr*.3)|0)+'" r="'+(pr|0)+'" fill="'+pal[0]+'" opacity=".55"/><ellipse cx="'+(px|0)+'" cy="'+(py|0)+'" rx="'+(pr*1.9|0)+'" ry="'+(pr*.38|0)+'" fill="none" stroke="'+pal[pal.length-1]+'" stroke-width="'+(w/180).toFixed(1)+'" opacity=".8" transform="rotate(-14 '+(px|0)+' '+(py|0)+')"/>';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+hh+'"><defs><filter id="b"><feGaussianBlur stdDeviation="'+(w/12|0)+'"/></filter></defs><rect width="100%" height="100%" fill="'+pal[0]+'"/><g filter="url(#b)">'+g+'</g>'+st+planet+'</svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const P=[['#0B0820','#7C3AED','#EC4899','#FDE68A'],['#06121F','#0EA5E9','#6366F1','#F0ABFC'],['#140818','#DB2777','#9333EA','#67E8F9'],['#04140F','#10B981','#0EA5E9','#FBBF24'],['#100B26','#8B5CF6','#22D3EE','#FDA4AF']];
const DEMO={
  series:[{id:'d1',name:'Sample Galaxy A',desc:''},{id:'d2',name:'Sample Galaxy B',desc:''},{id:'d3',name:'Sample Galaxy C',desc:''}],
  works:[
    [800,1000,0,'d1','Stardust'],[900,900,1,'d2','Tides'],[800,1100,2,'d3','Echo'],[1000,800,3,'d2','Voyage'],
    [800,1000,4,'d1','Night Flight'],[900,1150,1,'d3','Gravity'],[1000,800,0,'d1','Orbit'],[800,1000,3,'d2','Aurora'],[800,1000,2,'d3','Milky Way']
  ].map((a,i)=>({id:'demo'+i,src:art(11+i*37,a[0],a[1],P[a[2]]),w:a[0],h:a[1],title:a[4],series:a[3],year:String(new Date().getFullYear()),medium:'Procreate',desc:'',rank:i,demo:true}))
};
const isDemo=WORKS.length===0;
const wList=()=>isDemo?DEMO.works:WORKS;
const sList=()=>isDemo?DEMO.series:SERIES;
const full=w=>w.src;
const thumb=w=>w.thumb||w.src;
const sName=w=>{const s=sList().find(x=>x.id===w.series);return s?s.name:''};
function seriesWorks(sid){
  const s=sList().find(x=>x.id===sid);
  const l=wList().filter(w=>w.series===sid).sort((a,b)=>(a.rank||0)-(b.rank||0));
  if(s&&s.cover){const i=l.findIndex(w=>w.id===s.cover);if(i>0)l.unshift(l.splice(i,1)[0]);}
  return l;
}
let filter='all';

function applyAccent(){
  const a=/^#[0-9a-f]{6}$/i.test(site.accent||'')?site.accent:'#A78BFA';
  const n=parseInt(a.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const lum=(.299*r+.587*g+.114*b)/255;
  const st=document.documentElement.style;
  st.setProperty('--accent',a);
  st.setProperty('--on-accent',lum>.55?'#15122B':'#FFFFFF');
}

/* ---------- media ---------- */
function mediaEl(w,o){
  o=o||{};
  if(w.kind==='video'){
    const v=h('video',{src:full(w),loop:true,playsinline:true,preload:'metadata','aria-label':w.title||''});
    if(o.lb){v.controls=true;v.autoplay=true;v.muted=false;}
    else{v.autoplay=true;v.muted=true;if(v.play)v.play().catch(()=>{});}
    return v;
  }
  return h('img',{src:o.lb?full(w):thumb(w),alt:w.title||'',decoding:'async',loading:o.eager?'eager':'lazy',draggable:'false'});
}

/* ---------- skeleton ---------- */
const root=$('#root');
const starCv=h('canvas',{class:'stars','aria-hidden':'true'});
const nebula=h('div',{class:'nebula','aria-hidden':'true'},h('i'),h('i'),h('i'));
const glow=h('div',{class:'glow-cursor','aria-hidden':'true'});
const navEl=h('header',{class:'nav',id:'top'});
const heroEl=h('section',{class:'hero',id:'hero'});
const seriesEl=h('section',{class:'sec',id:'galaxies'});
const workEl=h('section',{class:'sec',id:'works'});
const aboutEl=h('section',{class:'sec',id:'about'});
const footEl=h('footer');
const lbEl=h('div',{class:'lb','aria-hidden':'true',role:'dialog','aria-modal':'true','aria-label':'Artwork viewer'});
root.append(nebula,starCv,glow,navEl,h('main',{},heroEl,seriesEl,workEl,aboutEl),footEl,lbEl);

function go(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});}
const toTop=()=>scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
function svgIcon(d,sz){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',sz||18);s.setAttribute('height',sz||18);
  s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.8');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);s.append(p);return s;
}
const ICON={close:'M6 6l12 12M18 6L6 18',prev:'M15 5l-7 7 7 7',next:'M9 5l7 7-7 7',down:'M12 5v14M6 13l6 6 6-6'};

/* ---------- starfield ---------- */
const ctx=starCv.getContext('2d');
let W=0,H=0,DPR=1,stars=[],shoot=null,nextShoot=0,mx=0,my=0;
const SC=['255,255,255','199,210,254','240,171,252','165,243,252','253,230,138'];
function initStars(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  starCv.width=W*DPR;starCv.height=H*DPR;
  const n=Math.min(900,Math.round(W*H/2000));
  stars=Array.from({length:n},()=>{const z=Math.random();return {x:Math.random()*W,y:Math.random()*H,z:z,r:.25+z*z*1.5,t:Math.random()*TAU,s:.4+Math.random()*1.8,c:SC[Math.random()<.75?0:1+(Math.random()*4|0)]};});
}
function drawStars(ts,warp){
  if(!ctx)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const sy=scrollY,cx=W/2,cy=H*.47;
  for(const s of stars){
    const x=s.x+mx*s.z*-40, y=((s.y-sy*(.05+s.z*.25))%H+H)%H+my*s.z*-30;
    const tw=reduceMotion?.8:.55+.45*Math.sin(s.t+ts*.0012*s.s);
    if(warp>0){
      const k=1-warp*.96,dx=x-cx,dy=y-cy,k1=Math.max(0,k-.18*warp);
      ctx.strokeStyle='rgba('+s.c+','+(tw*(1-warp*.3))+')';ctx.lineWidth=s.r;
      ctx.beginPath();ctx.moveTo(cx+dx*k1,cy+dy*k1);ctx.lineTo(cx+dx*k,cy+dy*k);ctx.stroke();
    }else{
      ctx.fillStyle='rgba('+s.c+','+tw+')';
      ctx.beginPath();ctx.arc(x,y,s.r,0,TAU);ctx.fill();
      if(s.r>1.3){ctx.fillStyle='rgba('+s.c+','+(tw*.12)+')';ctx.beginPath();ctx.arc(x,y,s.r*4,0,TAU);ctx.fill();}
    }
  }
  if(reduceMotion||warp>0)return;
  if(!shoot&&ts>nextShoot){
    const ang=.35+Math.random()*.4;
    shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,vx:Math.cos(ang)*14,vy:Math.sin(ang)*14,life:1};
    nextShoot=ts+4000+Math.random()*7000;
  }
  if(shoot){
    const s=shoot,len=16;
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*len,s.y-s.vy*len);
    g.addColorStop(0,'rgba(255,255,255,'+s.life+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*len,s.y-s.vy*len);ctx.stroke();
    s.x+=s.vx;s.y+=s.vy;s.life-=.018;
    if(s.life<=0||s.x>W+200||s.y>H+200)shoot=null;
  }
}

/* ---------- nav ---------- */
function renderNav(){
  navEl.replaceChildren(
    h('button',{class:'brand',onclick:toTop},site.name),
    h('nav',{class:'nav-links','aria-label':'Sections'},
      sList().length?h('button',{onclick:()=>go('galaxies')},'Galaxies'):null,
      h('button',{onclick:()=>go('works')},'Works'),
      h('button',{onclick:()=>go('about')},'About')
    ),
    h('div',{class:'nav-r'})
  );
}
addEventListener('scroll',()=>navEl.classList.toggle('scrolled',scrollY>24),{passive:true});

/* ---------- hero: works orbiting the title ---------- */
let orbitCards=[],RX=400,RY=200,A=0,speed=1,targetSpeed=1,ringEls=[],titleEl=null;
const heroStart=performance.now();
function heroWorks(){
  const all=wList(),fav=(data.featured||[]).map(id=>all.find(w=>w.id===id)).filter(Boolean);
  return fav.concat(all.filter(w=>!fav.includes(w))).slice(0,8);
}
function renderHero(){
  titleEl=h('h1',{},site.name.trim().split(/\s+/).map(w=>h('span',{},w)));
  ringEls=[h('div',{class:'ring'}),h('div',{class:'ring r2'})];
  orbitCards=heroWorks().map(w=>{
    const open=()=>openLB(wList(),wList().indexOf(w));
    return {w:w,el:h('div',{class:'pc',role:'button',tabindex:'0','aria-label':'View '+(w.title||'artwork'),onclick:open,onkeydown:e=>{if(e.key==='Enter')open();}},mediaEl(w,{eager:true}))};
  });
  const orbit=h('div',{class:'orbit'},h('div',{class:'core'}),ringEls,orbitCards.map(c=>c.el));
  orbit.addEventListener('pointerover',e=>{if(e.target.closest('.pc'))targetSpeed=.15;});
  orbit.addEventListener('pointerout',e=>{if(e.target.closest('.pc'))targetSpeed=1;});
  heroEl.replaceChildren(orbit,titleEl,h('div',{class:'hero-foot'},
    h('p',{class:'tag'},site.tagline||''),
    h('button',{class:'enter',onclick:()=>go(sList().length?'galaxies':'works')},'Enter the ArtVerse',svgIcon(ICON.down,16))
  ));
  layoutOrbit();
}
function layoutOrbit(){
  if(!titleEl)return;
  const vw=innerWidth,vh=Math.max(560,innerHeight);
  const cw=vw<720?Math.round(vw*.19):Math.round(Math.min(160,Math.max(104,vw*.09)));
  orbitCards.forEach(c=>{c.el.style.width=cw+'px';});
  const r=titleEl.getBoundingClientRect();
  const th=r.height||vw*.2,tw=r.width||vw*.6;
  RX=Math.min(vw*.44,Math.max(tw*.62,vw*.3),680);
  RY=Math.min(vh*.36,th/2+cw*.7+14);
  ringEls[0].style.width=(RX*2)+'px';ringEls[0].style.height=(RY*2)+'px';
  ringEls[1].style.width=(RX*2.5)+'px';ringEls[1].style.height=(RY*2.5)+'px';
}
function orbitFrame(ts,dt){
  if(!orbitCards.length)return;
  speed+=(targetSpeed-speed)*.06;
  if(!reduceMotion)A+=dt*.00011*speed;
  const n=orbitCards.length,el=ts-heroStart;
  orbitCards.forEach((c,i)=>{
    const a=A+i*TAU/n+.4,d=Math.sin(a),sc=.6+.4*(d+1)/2;
    const x=Math.cos(a)*RX+mx*26*sc,y=d*RY+my*18*sc;
    const ap=reduceMotion?1:Math.max(0,Math.min(1,(el-1300-i*110)/700));
    c.el.style.transform='translate(-50%,-50%) translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+(sc*(.85+.15*ap)).toFixed(3)+')';
    c.el.style.opacity=(ap*(.4+.6*(d+1)/2)).toFixed(3);
    c.el.style.zIndex=d>0?6:1;
    c.el.style.filter='brightness('+(.55+.45*(d+1)/2).toFixed(2)+')';
  });
}

/* ---------- main loop ---------- */
let lastTs=0;
const loopStart=performance.now();
function loop(ts){
  const dt=Math.min(50,ts-(lastTs||ts));lastTs=ts;
  const warp=reduceMotion?0:Math.max(0,1-(ts-loopStart)/1500);
  drawStars(ts,warp*warp);
  if(scrollY<innerHeight*1.1)orbitFrame(ts,dt);
  requestAnimationFrame(loop);
}
addEventListener('mousemove',e=>{
  mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
  glow.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0)';glow.classList.add('on');
},{passive:true});
document.addEventListener('mouseleave',()=>glow.classList.remove('on'));
let rzT=0;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{initStars();layoutOrbit();},120);});

/* ---------- galaxies (series) ---------- */
function renderSeries(){
  const ss=sList();
  seriesEl.hidden=ss.length===0;
  if(!ss.length){seriesEl.replaceChildren();return;}
  seriesEl.replaceChildren(
    h('div',{class:'sec-head'},h('div',{},h('h2',{},'Galaxies'),h('p',{class:'sec-note'},'Each planet is a series. Pick one to explore it.'))),
    h('div',{class:'planets'},ss.map((s,i)=>{
      const l=seriesWorks(s.id),cover=l[0],ringed=i%2===0;
      return h('button',{class:'pl'+(filter===s.id?' active':''),onclick:()=>{setFilter(s.id);go('works');}},
        h('span',{class:'planet',style:'--g:'+GLOWS[i%GLOWS.length]},
          ringed?h('span',{class:'pring back'}):null,
          h('span',{class:'ball'},cover?mediaEl(cover):null),
          ringed?h('span',{class:'pring front'}):h('span',{class:'moon-orb',style:'animation-duration:'+(8+i%3*3)+'s'})
        ),
        h('span',{class:'p-name'},s.name),
        h('span',{class:'p-meta'},plural(l.length,'work','works')+(s.desc?'  '+s.desc:''))
      );
    }))
  );
}

/* ---------- works ---------- */
let io=null;
function visible(){
  const all=wList();
  if(filter==='all')return all;
  if(filter==='none')return all.filter(w=>!w.series||!sList().some(s=>s.id===w.series));
  return seriesWorks(filter);
}
function setFilter(f){filter=f;renderSeries();renderWork();}
function renderWork(){
  const all=wList(),ss=sList();
  const unc=all.filter(w=>!w.series||!ss.some(s=>s.id===w.series)).length;
  const chips=[chip('All',all.length,'all')];
  ss.forEach(s=>chips.push(chip(s.name,all.filter(w=>w.series===s.id).length,s.id)));
  if(ss.length&&unc)chips.push(chip('Uncategorized',unc,'none'));
  const list=visible();
  const grid=h('div',{class:'grid'});
  if(!list.length){grid.className='';grid.append(h('div',{class:'empty-box'},'Nothing in this galaxy yet.'));}
  else list.forEach((w,i)=>grid.append(tile(w,i,list)));
  workEl.replaceChildren(
    h('div',{class:'sec-head'},h('h2',{},'Works'),h('div',{class:'chips',role:'group','aria-label':'Filter by series'},chips)),
    isDemo?h('div',{class:'notice'},'These are sample pieces. Add your artwork to the art folder of the repository and it will take their place.'):null,
    grid
  );
  observeTiles();
}
function chip(label,n,id){return h('button',{class:'chip'+(filter===id?' on':''),'aria-pressed':filter===id?'true':'false',onclick:()=>setFilter(id)},label,h('small',{},n));}
function tile(w,i,list){
  const sn=sName(w),m=mediaEl(w);
  if(w.w&&w.h)m.style.aspectRatio=w.w+'/'+w.h;
  const open=()=>openLB(list,i);
  return h('figure',{class:'tile',tabindex:'0',role:'button','aria-label':'View '+(w.title||'artwork'),onclick:open,onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}}},
    m,h('figcaption',{class:'cap'},h('b',{},w.title||'Untitled'),sn?h('span',{},sn):null));
}
function observeTiles(){
  const ts=[...workEl.querySelectorAll('.tile')];
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window)){ts.forEach(t=>t.classList.add('in'));return;}
  io=new IntersectionObserver(es=>{es.forEach((e,k)=>{if(e.isIntersecting){const t=e.target;setTimeout(()=>t.classList.add('in'),(k%6)*80);io.unobserve(t);}});},{rootMargin:'0px 0px -6% 0px',threshold:.05});
  ts.forEach(t=>io.observe(t));
}

/* ---------- about ---------- */
function safeUrl(u){
  u=(u||'').trim();if(!u)return '';
  if(/^https?:\/\//i.test(u))return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';
  return 'https://'+u;
}
function renderAbout(){
  const links=[];
  if(site.email)links.push(h('a',{href:'mailto:'+site.email.trim()},site.email.trim()));
  (site.links||[]).forEach(l=>{const u=safeUrl(l.url);if(u)links.push(h('a',{href:u,target:'_blank',rel:'noopener noreferrer'},l.label||u));});
  aboutEl.hidden=!site.bio&&!links.length;
  aboutEl.replaceChildren(
    h('div',{class:'sec-head'},h('h2',{},'About')),
    h('div',{class:'about-grid'},h('p',{class:'bio'},site.bio||''),h('div',{class:'contact'},links))
  );
  footEl.replaceChildren(h('span',{},'© '+new Date().getFullYear()+' '+site.name),h('button',{onclick:toTop},'Back to top'));
}

/* ---------- lightbox ---------- */
const LB={list:[],i:0,open:false,tok:0,last:null};
const lbFrame=h('div',{class:'lb-frame'});
const lbTitle=h('h3'),lbMeta=h('div',{class:'lb-meta'}),lbDesc=h('p',{class:'lb-desc'}),lbCount=h('div',{class:'lb-count'});
const lbClose=h('button',{class:'lb-btn lb-close','aria-label':'Close',onclick:closeLB},svgIcon(ICON.close));
lbEl.append(
  h('div',{class:'lb-stage',onclick:e=>{if(e.target.classList.contains('lb-stage'))closeLB();}},
    lbClose,
    h('button',{class:'lb-btn lb-prev','aria-label':'Previous',onclick:()=>stepLB(-1)},svgIcon(ICON.prev)),
    lbFrame,
    h('button',{class:'lb-btn lb-next','aria-label':'Next',onclick:()=>stepLB(1)},svgIcon(ICON.next))
  ),
  h('div',{class:'lb-info'},h('div',{},lbTitle,lbMeta,lbDesc),lbCount)
);
function openLB(list,i){
  if(i<0||!list[i])return;
  LB.last=document.activeElement;
  LB.list=list;LB.i=i;LB.open=true;
  lbEl.classList.add('open');lbEl.setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden';
  showLB();lbClose.focus();
}
function closeLB(){
  LB.open=false;LB.tok++;
  lbEl.classList.remove('open');lbEl.setAttribute('aria-hidden','true');
  document.documentElement.style.overflow='';
  lbFrame.replaceChildren();
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(LB.last&&LB.last.focus)LB.last.focus();
}
function stepLB(d){const n=LB.list.length;if(n<2)return;LB.i=(LB.i+d+n)%n;showLB();}
function showLB(){
  const w=LB.list[LB.i];if(!w)return;
  const tok=++LB.tok,el=mediaEl(w,{lb:true,eager:true});
  if(w.kind!=='video'){
    const setO=e=>{const r=el.getBoundingClientRect();el.style.transformOrigin=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))+'% '+Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))+'%';};
    el.addEventListener('click',e=>{if(el.classList.toggle('zoomed'))setO(e);});
    el.addEventListener('mousemove',e=>{if(el.classList.contains('zoomed'))setO(e);});
  }
  const done=()=>{
    if(tok!==LB.tok)return;
    lbFrame.style.opacity=0;lbFrame.replaceChildren(el);
    requestAnimationFrame(()=>{lbFrame.style.opacity=1;});
  };
  if(w.kind==='video')done();
  else{const pre=new Image();pre.onload=pre.onerror=done;pre.src=full(w);}
  lbTitle.textContent=w.title||'Untitled';
  lbMeta.replaceChildren(...[sName(w),w.year,w.medium].filter(Boolean).map(x=>h('span',{},x)));
  lbDesc.textContent=w.desc||'';lbDesc.style.display=w.desc?'':'none';
  lbCount.textContent=(LB.i+1)+' / '+LB.list.length;
  [LB.i-1,LB.i+1].forEach(j=>{const x=LB.list[j];if(x&&x.kind!=='video'){new Image().src=full(x);}});
  if(!w.demo){try{history.replaceState(null,'','#'+w.id);}catch(e){}}
}
let tx0=null;
lbEl.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
lbEl.addEventListener('touchend',e=>{
  if(tx0==null)return;
  const dx=e.changedTouches[0].clientX-tx0;tx0=null;
  if(Math.abs(dx)>60)stepLB(dx<0?1:-1);
});
addEventListener('keydown',e=>{
  if(!LB.open)return;
  if(e.key==='Escape')closeLB();
  else if(e.key==='ArrowLeft')stepLB(-1);
  else if(e.key==='ArrowRight')stepLB(1);
});

/* ---------- boot ---------- */
applyAccent();document.title=site.name;
initStars();renderNav();renderHero();renderSeries();renderWork();renderAbout();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutOrbit);
requestAnimationFrame(loop);
const m=/^#(w[0-9a-f]{8})$/.exec(location.hash||'');
if(m){const all=wList(),i=all.findIndex(w=>w.id===m[1]);if(i>=0)setTimeout(()=>openLB(all,i),600);}
})();
</script>
